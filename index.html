<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>당근마켓 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 모바일 앱 한 칸(최대 480px) 안에서 피드 → 상세 → 채팅 → 리포트 화면이 교체되는 구조 */
:root{
  --bg:#ffffff;
  --surface:#f6f4f1;
  --surface-2:#ebe8e3;
  --fg:#241f1b;
  --muted:#6e675f;
  --line:#e7e3dd;
  --accent:#ec5f0a;
  --on-accent:#ffffff;
  --accent-soft:#fff0e4;
  --good:#1a8a4c;
  --bad:#c93a33;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141210;--surface:#1f1c19;--surface-2:#2b2723;--fg:#f3efe9;--muted:#a59e94;--line:#35302b;
    --accent:#ff8a3d;--on-accent:#1c1008;--accent-soft:#3b2615;--good:#4cc486;--bad:#ff7d75;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141210;--surface:#1f1c19;--surface-2:#2b2723;--fg:#f3efe9;--muted:#a59e94;--line:#35302b;
  --accent:#ff8a3d;--on-accent:#1c1008;--accent-soft:#3b2615;--good:#4cc486;--bad:#ff7d75;color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:480px;margin-inline:auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:56px}
.bar .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin-left:-8px;font-size:20px}
.bar .back:hover{background:var(--surface)}
.bar .ttl{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:10px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn.block{width:100%}

/* 피드 */
.theme{flex:none;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:500}
.theme:hover{background:var(--surface-2)}
.brand-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{padding:20px 16px 12px}
.brand h1{font-family:var(--font-display);font-size:28px;line-height:1.2;color:var(--accent);letter-spacing:.01em}
.brand p{color:var(--muted);font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.chip{padding:6px 13px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.feed li+li{border-top:1px solid var(--line)}
.item{display:flex;gap:14px;padding:16px;width:100%;text-align:left;align-items:flex-start}
.item:hover{background:var(--surface)}
.thumb{--h:30;flex:none;width:96px;height:96px;border-radius:12px;display:grid;place-items:center;font-size:44px;background:color-mix(in srgb,hsl(var(--h) 75% 55%) 24%,var(--surface))}
.item .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:500;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.item .m{color:var(--muted);font-size:13px}
.item .p{font-weight:700;font-size:16px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.stars{font-size:12px;color:var(--muted)}
.foot{padding:20px 16px 28px;color:var(--muted);font-size:12px;text-align:center}

/* 상세 */
.hero{--h:30;aspect-ratio:16/10;width:100%;max-height:300px;display:grid;place-items:center;font-size:96px;background:color-mix(in srgb,hsl(var(--h) 75% 55%) 24%,var(--surface))}
.det{padding:16px;display:flex;flex-direction:column;gap:14px}
.seller{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.seller b{display:block}
.seller span{color:var(--muted);font-size:13px}
.det h2{font-size:20px;line-height:1.35}
.det .cat{color:var(--muted);font-size:13px}
.det .desc{white-space:pre-line}
.practice{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.practice h3{font-size:13px;color:var(--muted);font-weight:500}
.cta{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.cta .price{flex:1;min-width:0;font-weight:700;font-size:20px}
.cta .price small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.cta .btn{flex:none}

/* 채팅 */
.mood{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2)}
.dots i.on{background:var(--accent)}
.chat-item{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.chat-item .mini{--h:30;flex:none;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,hsl(var(--h) 75% 55%) 24%,var(--surface-2))}
.chat-item .tt{flex:1;min-width:0;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.chat-item .pr{text-align:right;font-weight:700;font-size:15px}
.chat-item .pr s{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.msgs{padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;overflow-wrap:anywhere;font-size:15px;line-height:1.5}
.msg.them{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.sys{align-self:center;text-align:center;font-size:12px;color:var(--muted);background:var(--surface);padding:4px 12px;border-radius:999px}
.msg.thought{align-self:center;max-width:92%;background:var(--accent-soft);color:var(--accent);font-style:italic;font-size:13px;border-radius:14px;text-align:center}
.typing{display:inline-flex;gap:4px;align-items:center;padding:13px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}

.panel{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--bg);max-height:62%;overflow-y:auto}
.panel .hint{font-size:13px;color:var(--muted)}
.wait{text-align:center;color:var(--muted);font-size:14px;padding:14px 0}
.opt{width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface);font-weight:500}
.opt:hover{background:var(--surface-2)}
.opt b{display:block;font-weight:700}
.opt span{display:block;color:var(--muted);font-size:13px;font-weight:400}
.opt:disabled{opacity:.45;cursor:not-allowed}
.q{text-align:left}
.panel>.q{align-self:flex-start}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .sb{flex:none;width:46px;height:46px;border-radius:12px;background:var(--surface);font-size:22px;font-weight:700}
.stepper .sb:disabled{opacity:.35;cursor:not-allowed}
.stepper .val{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-size:30px;line-height:1.1}
.amt-row{display:flex;align-items:baseline;justify-content:center;gap:4px;border-bottom:2px solid var(--line);padding-bottom:2px}
.amt-row:focus-within{border-color:var(--accent)}
.amt{width:100%;min-width:0;border:0;outline:none;background:transparent;color:var(--fg);font-family:var(--font-display);font-size:30px;line-height:1.15;text-align:right;padding:0}
.amt-row span{font-family:var(--font-display);font-size:22px;flex:none}
.err{color:var(--bad);font-size:13px}
.stepper .val small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted)}
.quick,.sweets{display:flex;flex-wrap:wrap;gap:8px}
.q{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.q:hover{border-color:var(--accent)}
.q[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.label{font-size:12px;color:var(--muted);font-weight:500}
.sub{display:flex;gap:8px}
.sub .btn{flex:1;min-height:42px;font-size:14px}

/* 리포트 */
.rep{padding:20px 16px 28px;display:flex;flex-direction:column;gap:18px}
.verdict{font-family:var(--font-display);font-size:30px;line-height:1.2}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.rep .lead{color:var(--muted);margin-top:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair>div{background:var(--surface);border-radius:12px;padding:14px;min-width:0}
.pair .k{font-size:12px;color:var(--muted)}
.pair .v{font-family:var(--font-display);font-size:26px;line-height:1.25;margin-top:2px}
.pair .v.acc{color:var(--accent)}
.pair .s{font-size:12px;color:var(--muted)}
.scale{position:relative;padding:34px 0 54px}
.track{position:relative;height:14px;border-radius:7px;background:var(--surface-2)}
.seg{position:absolute;top:0;bottom:0}
.seg.gap{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,var(--line) 5px 9px);border-radius:0}
.seg.saved{background:var(--accent)}
.tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg);margin-left:-1px}
.dotm{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);border:5px solid var(--accent);transform:translate(-50%,-50%)}
.pin{position:absolute;top:0;transform:translateX(-50%);font-size:12px;text-align:center;white-space:nowrap;line-height:1.3}
.pin b{display:block;font-size:14px}
.lab{position:absolute;top:calc(100% - 44px);font-size:12px;color:var(--muted);line-height:1.35;white-space:nowrap}
.lab b{display:block;color:var(--fg);font-size:14px}
.lab.l{padding-left:6px;border-left:2px solid var(--fg)}
.lab.r{text-align:right;padding-right:6px;border-right:2px solid var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.rows{border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rows dt{color:var(--muted)}
.rows dd{margin:0;font-weight:700;text-align:right}
.reveal{background:var(--accent-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.reveal h3{font-size:13px;color:var(--accent)}
.act{display:flex;gap:10px;flex-wrap:wrap}
.act .btn{flex:1 1 140px}
</style>
</head>
<body>


<div class="app" id="app">
  <!-- 피드 -->
  <section class="screen" id="s-feed">
    <div class="scroll">
      <div class="brand">
        <div class="brand-top"><h1>당근마켓 시뮬레이터</h1><button class="theme" data-act="theme" type="button"></button></div>
        <p>중고거래 연습도우미 · 채팅으로 얼마까지 깎을 수 있는지 연습해요</p>
      </div>
      <div class="chips" id="cats" role="group" aria-label="카테고리"></div>
      <ul class="feed" id="feed"></ul>
      <p class="foot">당근마켓과 관련 없는 비공식 연습용 시뮬레이터예요.<br>상품과 판매자는 모두 가상입니다.</p>
    </div>
  </section>

  <!-- 상세 -->
  <section class="screen" id="s-detail" hidden>
    <div class="bar"><button class="back" data-go="feed" aria-label="뒤로">‹</button><div class="ttl"></div><button class="theme" data-act="theme" type="button"></button></div>
    <div class="scroll" id="detail"></div>
    <div class="cta" id="detailCta"></div>
  </section>

  <!-- 채팅 -->
  <section class="screen" id="s-chat" hidden>
    <div class="bar">
      <button class="back" id="chatBack" aria-label="나가기">‹</button>
      <div class="ttl"><b id="chatName"></b></div>
      <div class="mood"><span>판매자 인내심</span><span class="dots" id="dots"></span></div>
    </div>
    <div class="chat-item" id="chatItem"></div>
    <div class="scroll" id="msgsWrap"><div class="msgs" id="msgs" aria-live="polite"></div></div>
    <div class="panel" id="panel"></div>
  </section>

  <!-- 리포트 -->
  <section class="screen" id="s-report" hidden>
    <div class="bar"><button class="back" data-go="feed" aria-label="처음으로">‹</button><div class="ttl"><b>결과 리포트</b></div><button class="theme" data-act="theme" type="button"></button></div>
    <div class="scroll" id="report"></div>
  </section>
</div>

<script>
(function(){
  /* ---------- 데이터 ---------- */
  var PERSONAS = {};   /* data/personas.json 에서 불러옴 */
  var SWEET = {
    polite:{label:'정중하게 부탁', text:'혹시 조금만 조정해주실 수 있을까요?'},
    reason:{label:'사정 이야기', text:'학생이라 예산이 빠듯해서요 ㅠㅠ'},
    now:   {label:'오늘 바로 거래', text:'오늘 바로 받으러 갈 수 있어요!'},
    cash:  {label:'현금 결제', text:'현금으로 바로 드릴게요.'},
    flaw:  {label:'하자 이야기하기', text:''}
  };
  var BONUS = {
    kind:  {polite:.10, reason:.15, now:.05, cash:.05, flaw:.10},
    grumpy:{polite:.15, reason:-.05, now:.10, cash:.05, flaw:.05},
    firm:  {polite:.10, reason:0,   now:.10, cash:.15, flaw:.08},
    urgent:{polite:.05, reason:.05, now:.25, cash:.10, flaw:.08}
  };
  var OPENERS = [
    {text:'안녕하세요! 아직 판매 중인가요?', rapport:.10},
    {text:'안녕하세요, 게시글 보고 연락드렸어요. 직거래 가능할까요?', rapport:.12},
    {text:'네고 되나요?', rapport:0},
    {text:'얼마까지 해줘요?', rapport:-.08}
  ];
  var OPENER_REPLY = {
    kind:  ['안녕하세요~ 네, 아직 판매 중이에요 :)', '네~ 직거래 좋아요! 편하신 곳으로 맞출게요 :)', '네~ 조금은 가능해요! 얼마 생각하세요?', '음... 얼마 생각하고 계세요? ㅎㅎ'],
    grumpy:['네. 있어요.', '네, 직거래로 하시죠.', '조금은요.', '인사도 없이 가격부터요...? 네, 있어요.'],
    firm:  ['안녕하세요. 네 있습니다. 네고는 어렵습니다.', '네, 직거래 가능합니다.', '네고는 거의 안 됩니다.', '있습니다. 가격은 고정입니다.'],
    urgent:['네네! 아직 있어요!! 빨리 가져가실 분 찾고 있어요 ㅠㅠ', '네네 직거래 완전 좋아요!! 빨리 가져가 주세요!', '네네 조금은 가능해요 ㅠㅠ 급해서요!', '음... 급해서 많이는 못 깎아드리는데 얼마 생각하세요?']
  };
  var REPLY = {
    kind:{
      accept:function(p){return '네, 좋아요! '+won(p)+'에 드릴게요 :)';},
      counter:function(c){return '음~ 그럼 '+won(c)+'에 드릴게요! 더 해드리기는 좀 어려워요 ㅎㅎ';},
      stuck:'죄송해요 ㅠㅠ 지금 가격이 정말 최선이에요.',
      insult:'앗, 그 가격은 너무 낮아서 어려워요 ㅠㅠ 조금만 더 올려주세요~',
      final:function(c){return won(c)+'이 마지막이에요! 괜찮으시면 거래해요 :)';},
      leave:'아무래도 어렵겠네요. 다음에 또 연락주세요!',
      take:'감사합니다! 거래 시간 정해봐요 :)',
      bye:'네 괜찮아요~ 다음에 또 연락주세요!'},
    grumpy:{
      accept:function(p){return '...그럼 '+won(p)+'에 가져가세요.';},
      counter:function(c){return '하... '+won(c)+'까지는 볼게요.';},
      stuck:'더는 안 깎아요. 사실 거면 사시고요.',
      insult:'지금 장난하세요? 그 가격엔 안 팔아요.',
      final:function(c){return won(c)+'. 마지막이에요. 싫으면 말고요.';},
      leave:'시간 낭비하기 싫어요. 거래 안 할게요.',
      take:'네. 그럼 시간 정해서 말씀하세요.',
      bye:'네.'},
    firm:{
      accept:function(p){return '...알겠습니다. '+won(p)+'에 하시죠.';},
      counter:function(c){return '정말 이번만 '+won(c)+'에 드릴게요. 가격은 거의 안 깎아요.';},
      stuck:'네고 불가라고 적어뒀어요. 이 가격이 최선이에요.',
      insult:'그 가격은 안 됩니다. 제 가격이 시세예요.',
      final:function(c){return won(c)+' 이하는 절대 안 돼요. 마지막입니다.';},
      leave:'네고 불가 상품이라고 말씀드렸죠. 거래 안 하겠습니다.',
      take:'알겠습니다. 시간 정해서 연락주세요.',
      bye:'네, 알겠습니다.'},
    urgent:{
      accept:function(p){return '좋아요 좋아요! '+won(p)+'에 바로 가져가세요!';},

  /* ---------- 화면 모드 ---------- */
  function effectiveTheme(){
    var t = document.documentElement.getAttribute('data-theme');
    if(t==='dark'||t==='light') return t;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function paintThemeBtns(){
    var next = effectiveTheme()==='dark' ? '라이트 모드' : '다크 모드';
    document.querySelectorAll('.theme').forEach(function(b){b.textContent = next + '로';});
  }
  function toggleTheme(){
    var next = effectiveTheme()==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('sim-theme', next); }catch(e){}
    paintThemeBtns();
  }

    show('chat');
  }
  function renderChatItem(){
    var p = st.p;
    $('#chatItem').innerHTML =
      '<div class="mini" style="--h:'+p.hue+'">'+p.emoji+'</div>'+
      '<div class="tt">'+p.title+'</div>'+

  function renderDots(){

    $('#dots').innerHTML = h;

  }
  function scrollDown(){var w=$('#msgsWrap'); w.scrollTop = w.scrollHeight;}
  function addMsg(side,text){
    var d=document.createElement('div'); d.className='msg '+side; d.textContent=text;
    $('#msgs').appendChild(d); scrollDown();
  }
  function addSys(text){
    var d=document.createElement('div'); d.className='sys'; d.textContent=text;
    $('#msgs').appendChild(d); scrollDown();
  }
  function addThought(text){
    var d=document.createElement('div'); d.className='msg thought'; d.textContent='💭 속마음: '+text;
    $('#msgs').appendChild(d); scrollDown();
  }
  function sellerSay(text, after){
    st.busy = true; renderPanel();
    var t=document.createElement('div'); t.className='msg them typing'; t.innerHTML='<i></i><i></i><i></i>';
    $('#msgs').appendChild(t); scrollDown();
    var delay = reduce ? 150 : Math.min(1200, 550 + text.length*14);
    setTimeout(function(){
      t.remove(); addMsg('them',text); st.busy=false;
      if(after) after();
      renderChatItem(); renderDots(); renderPanel();
    }, delay);
  }

  function R(){return REPLY[st.p.persona];}
  function threshold(){
    var pe = PERSONAS[st.p.persona], p = st.p, u = unit(p.ask);
    var f = clamp(pe.stiff - st.rapport, 0, 1);
    return Math.min(st.curAsk, roundUp(p.floor + (p.ask - p.floor)*f, u));
  }
  function endDeal(price,text){
    sellerSay(text, function(){
      st.endThreshold = threshold();
      st.result = {deal:true, price:price}; st.stage='done';
      addSys('거래가 성사됐어요');
      addThought('사실 '+won(st.p.floor)+'까지는 생각하고 있었어요.');
    });
  }
  function endLeave(text,quit,blocked){
    sellerSay(text, function(){
      st.endThreshold = threshold();
      st.result = {deal:false, quit:!!quit, blocked:!!blocked}; st.stage='done';
      addSys(blocked?'판매자가 회원님을 차단했어요':(quit?'거래를 포기했어요':'판매자가 대화방을 나갔어요'));
      addThought('사실 '+won(st.p.floor)+'까지는 생각하고 있었어요.');
    });
  }
  function pickLine(pool){
    var left = pool.filter(function(l){return !st.lines[l];});
    if(!left.length){ left = pool; }
    var l = left[Math.floor(Math.random()*left.length)];
    st.lines[l] = true; return l;
  }
  /* 화난 판매자의 한마디 → 인내심이 바닥나면 차단 또는 대화방 나가기 */
  function angry(line){
    var per = st.p.persona;
    if(st.patience>0){ sellerSay(line); return; }
    st.patience = 0;
    sellerSay(line, function(){
      if(BLOCK_LINE[per]) endLeave(BLOCK_LINE[per], false, true);
      else endLeave(R().leave);
    });
  }
  function chooseOpener(i){
    var op = OPENERS[i];
    addMsg('me', op.text); st.rapport += op.rapport; st.stage='nego';
    logPush(op.text, op.rapport);
    if(i===1) st.met.direct = true;
    sellerSay(OPENER_REPLY[st.p.persona][i]);
  }
  function sendOffer(){
    var p = st.p, P = st.offerVal, u = unit(p.ask), pe = PERSONAS[p.persona];
    var sweets = Object.keys(st.sel).filter(function(k){return st.sel[k];});
    var parts = sweets.map(function(k){return k==='flaw' ? '아까 말씀하신 '+st.flaws[0]+' 때문에 조금만 조정해주세요.' : SWEET[k].text;});
    parts.push(won(P)+'에 구매하고 싶어요.');
    addMsg('me', parts.join(' '));
    sweets.forEach(function(k){
      var d = BONUS[p.persona][k];
      st.rapport += d; st.used[k]=true;
      logPush(k==='flaw' ? '하자 이야기하기' : SWEET[k].label, d);
    });
    var prev = st.lastOffer; st.sel = {}; st.lastOffer = Math.max(prev, P); st.rounds++; st.view = 'root'; st.follow = [];
    var T = threshold();
    var insultLine = roundDn(p.floor*0.85, u);
    var priceMsg = won(P)+'에 구매하고 싶어요.';
    st.offerVal = null;
    if(P >= T){ logPush(priceMsg, .05); endDeal(P, R().accept(P)); return; }
    if(P < p.ask*0.5){
      st.patience -= (p.persona==='grumpy'||p.persona==='firm') ? 4 : 3; st.rapport -= .08;
      logPush(priceMsg, -.08);
      angry(pickLine(HARSH[p.persona]));
      return;
    }
    if(P < insultLine){
      st.patience -= (p.persona==='grumpy'?3:2); st.rapport -= .05;
      logPush(priceMsg, -.05);
      angry(pickLine(INSULT[p.persona]));
      return;
    }
    if(prev && P <= prev){
      st.patience -= (P<prev ? 2 : 1); st.rapport -= .04;
      logPush(priceMsg, -.04);
      angry(P<prev ? LOWER[p.persona] : REPEAT[p.persona]);
      return;
    }
    logPush(priceMsg, 0);
    var next = Math.max(T, roundDn(st.curAsk - (st.curAsk-P)*pe.k, u));
    if(next >= st.curAsk) next = Math.max(T, st.curAsk - u);
    next = Math.min(next, st.curAsk);
    st.patience -= 1;
    if(next >= st.curAsk){
      if(st.patience<=0){ st.patience=0; endLeave(R().leave); }
      else sellerSay(R().stuck);
      return;
    }
    st.curAsk = next;
    if(st.patience<=0){
      st.patience = 0; st.final = true;
      sellerSay(R().final(next));
    } else {
      sellerSay(R().counter(next));
    }
  }
  function buyNow(){
    addMsg('me', won(st.curAsk)+'에 구매할게요.');
    st.stage='wait';
    endDeal(st.curAsk, R().take);
  }
  function giveUp(){
    addMsg('me','죄송하지만 이번엔 어려울 것 같아요.');
    endLeave(R().bye, true);
  }

  function offerRange(){
    var u = unit(st.p.ask);
    return {u:u, max:st.curAsk-u, min:u};
  }
  function tone(text){
    var per = st.p.persona;
    if(per==='kind' && text.indexOf(':)')<0) return text+' :)';
    if(per==='grumpy' && st.qCount>2) return text+' 질문이 좀 많네요.';
    if(per==='urgent' && st.qCount>1) return text+' 그런데 빨리 정하실 수 있어요? ㅠㅠ';
    return text;
  }
  function doAsk(k){
    var f = FACTS[st.p.id][k], per = st.p.persona, follow, d = 0;
    st.asked[k] = true; st.qCount++; st.view = 'root'; st.follow = [];
    addMsg('me', ASK_Q[k]);
    if(per==='kind') d = .03;
    if(per==='grumpy' && st.qCount>2){ d = -.03; st.patience = Math.max(1, st.patience-1); }
    if(per==='urgent' && st.qCount>2) d = -.04;
    st.rapport += d;
    logPush(ASK_Q[k], d);
    if(k==='flaw' && f.label){ st.flaws.push(f.label); follow = ['concern','ack']; }
    else if(k==='why') follow = ['sympathy','thanks'];
    else follow = ['thanks','ack'];
    sellerSay(tone(f.a), function(){ st.follow = follow; });
  }
  function doFollow(k){
    var per = st.p.persona, d = REACT_FX[per][k] || 0;
    st.follow = []; st.view = 'root';
    addMsg('me', FOLLOW[k]);
    st.rapport += d;
    logPush(FOLLOW[k], d);
    if(k==='concern') st.flawNoted = true;
    sellerSay(REACT_R[per][k]);
  }
  function doMeet(k){
    var p = st.p, per = p.persona, fx = MEET_FX[per][k], reply, d = 0;
    st.met[k] = true; st.view = 'root'; st.follow = [];
    addMsg('me', MEET_Q[k](p));
    if(k==='ship' && !SHIP[p.id]){ reply = MEET_R[per].noship; }
    else { d = fx; st.rapport += d; reply = MEET_R[per][k]; }
    logPush(MEET_L[k], d);
    sellerSay(typeof reply==='function' ? reply(p) : reply);
  }
  function hintText(v){
    return '판매자 제시가 '+won(st.curAsk)+(v ? ' · 처음 가격보다 약 '+Math.round((1-v/st.p.ask)*100)+'% 낮게' : ' · 금액을 직접 입력할 수 있어요');
  }
  function showErr(msg){var e=$('#offerErr'); if(e){e.textContent=msg; e.hidden=false;}}
  function trySend(){
    var v = st.offerVal;
    if(!v || v<100){ showErr('제안할 금액을 입력해 주세요. 100원 이상부터 돼요.'); return; }
    if(v>=st.curAsk){ showErr('판매자 제시가 '+won(st.curAsk)+'보다 낮게 불러야 해요. 그 가격에 사려면 돌아가서 구매를 누르세요.'); return; }
    sendOffer();
  }
  function backBtn(){return '<button class="q" data-act="view" data-v="root">‹ 돌아가기</button>';}
  function offerHtml(rg){
    var p = st.p, u = rg.u, min = rg.min, max = rg.max;
    if(st.offerVal==null){
      var d = st.lastOffer ? roundDn((st.lastOffer+st.curAsk)/2,u) : roundDn(p.ask*.9,u);
      st.offerVal = clamp(d,min,max);
    }
    var v = st.offerVal;
    var sw = Object.keys(SWEET).filter(function(k){return !st.used[k] && (k!=='flaw' || st.flaws.length);});
    return '<div class="label">제안 가격</div>'+
      '<div class="stepper">'+
        '<button class="sb" data-act="step" data-d="-1" aria-label="'+won(u)+' 내리기">−</button>'+
        '<div class="val num"><div class="amt-row"><input id="offerInput" class="amt num" inputmode="numeric" autocomplete="off" aria-label="제안 가격 (원)" value="'+(v?v.toLocaleString('ko-KR'):'')+'"><span>원</span></div>'+
        '<small id="offerHint">'+hintText(v)+'</small></div>'+
        '<button class="sb" data-act="step" data-d="1" aria-label="'+won(u)+' 올리기">+</button>'+
      '</div>'+
      '<p class="err" id="offerErr" hidden></p>'+
      (sw.length?'<div class="label">함께 말하기 (한 번씩만 쓸 수 있어요)</div><div class="sweets" role="group">'+sw.map(function(k){
        return '<button class="q" data-act="sweet" data-k="'+k+'" aria-pressed="'+(!!st.sel[k])+'">'+SWEET[k].label+'</button>';
      }).join('')+'</div>':'')+
      '<button class="btn primary block" data-act="send">이 가격으로 제안하기</button>';
  }
  function renderPanel(){
    var P = $('#panel');
    if(st.busy){ P.innerHTML='<p class="wait">판매자가 입력 중이에요…</p>'; return; }
    if(st.stage==='open'){
      P.innerHTML = '<p class="hint">첫 인사로 보낼 말을 골라보세요</p>'+
        OPENERS.map(function(o,i){return '<button class="opt" data-act="open" data-i="'+i+'">'+o.text+'</button>';}).join('');
      return;
    }
    if(st.stage==='done'){
      P.innerHTML = '<button class="btn primary block" data-act="report">결과 보기</button>';
      return;
    }
    if(st.final){
      P.innerHTML = '<p class="hint">판매자가 마지막 가격을 말했어요. 이 가격에 살지 정해보세요.</p>'+
        '<button class="btn primary block" data-act="buy">'+won(st.curAsk)+'에 구매하기</button>'+
        '<button class="btn ghost block" data-act="quit">거래 포기</button>';
      return;
    }
    var rg = offerRange(), canOffer = rg.min<=rg.max;
    var askLeft = Object.keys(ASK_Q).filter(function(k){return !st.asked[k];});
    var meetLeft = Object.keys(MEET_Q).filter(function(k){return !st.met[k];});
    if(st.view==='ask'){
      P.innerHTML = backBtn()+'<div class="label">상품 상태 물어보기</div>'+
        askLeft.map(function(k){return '<button class="opt" data-act="ask" data-k="'+k+'">'+ASK_Q[k]+'</button>';}).join('');
      return;
    }
    if(st.view==='meet'){
      P.innerHTML = backBtn()+'<div class="label">거래 방식 이야기하기</div>'+
        meetLeft.map(function(k){return '<button class="opt" data-act="meet" data-k="'+k+'">'+MEET_L[k]+'</button>';}).join('');
      return;
    }
    if(st.view==='offer' && canOffer){
      P.innerHTML = backBtn()+offerHtml(rg);
      return;
    }
    var h = '';
    if(st.follow.length){
      h += '<div class="label">이어서 말하기</div><div class="quick">'+st.follow.map(function(k){
        return '<button class="q" data-act="follow" data-k="'+k+'">'+FOLLOW[k]+'</button>';
      }).join('')+'</div>';
    }
    h += '<div class="label">무엇을 말할까요?</div>'+
      '<button class="opt" data-act="view" data-v="ask"'+(askLeft.length?'':' disabled')+'><b>상품 상태 물어보기</b><span>'+(askLeft.length?'남은 질문 '+askLeft.length+'개':'궁금한 건 다 물어봤어요')+'</span></button>'+
      '<button class="opt" data-act="view" data-v="meet"'+(meetLeft.length?'':' disabled')+'><b>거래 방식 이야기하기</b><span>'+(meetLeft.length?'직거래, 택배, 장소, 시간 · 남은 주제 '+meetLeft.length+'개':'거래 방식은 다 이야기했어요')+'</span></button>'+
      '<button class="opt" data-act="view" data-v="offer"'+(canOffer?'':' disabled')+'><b>가격 제안하기</b><span>'+(canOffer?'현재 제시가 '+won(st.curAsk):'더 제안할 가격 범위가 없어요')+'</span></button>'+
      '<div class="sub"><button class="btn ghost" data-act="buy">'+won(st.curAsk)+'에 구매</button><button class="btn ghost" data-act="quit">거래 포기</button></div>';
    P.innerHTML = h;
  }

  /* ---------- 리포트 ---------- */
  function renderReport(){
    var p = st.p, r = st.result, pe = PERSONAS[p.persona];
    var maxSave = p.ask - p.floor;
    var deal = r.deal, fin = deal ? r.price : null;
    var saved = deal ? p.ask - fin : 0;
    var missed = deal ? fin - p.floor : maxSave;
    var pct = deal && maxSave>0 ? clamp(Math.round(saved/maxSave*100),0,100) : 0;
    var endT = st.endThreshold != null ? st.endThreshold : threshold();
    var lo = p.floor - maxSave*.3, hi = p.ask + maxSave*.08;
    var X = function(v){return ((v-lo)/(hi-lo)*100);};
    var xf = X(p.floor), xa = X(p.ask), xv = deal ? X(fin) : null;

    var head, lead;

             pct>=70 ? '잘 깎았어요. 조금만 더 해볼 수 있었어요.' :
             pct>=40 ? '절반 정도 깎았어요. 호감 포인트를 더 써보세요.' :
                       '더 깎을 여지가 많이 남아 있었어요.';
    } else {
      head = '<h2 class="verdict no">'+(r.blocked?'차단당함':'거래 결렬')+'</h2>';

             r.quit ? '직접 거래를 포기했어요.' : '판매자가 대화방을 나갔어요. 너무 낮은 가격을 부르면 인내심이 빨리 줄어요.';

    /* 판매자 속마음: 맨 위, 가장 크게 */

          '<div class="track">'+
            (deal?'<div class="seg gap" style="left:'+xf+'%;width:'+(xv-xf)+'%"></div><div class="seg saved" style="left:'+xv+'%;width:'+(xa-xv)+'%"></div>'

        logHtml+
        '<dl class="rows num" style="margin:0">'+
          '<div><dt>처음 가격</dt><dd>'+won(p.ask)+'</dd></div>'+
          '<div><dt>최종 가격</dt><dd>'+(deal?won(fin):'거래 안 함')+'</dd></div>'+

          '<div><dt>'+(deal?'더 깎을 수 있던 금액':'놓친 금액')+'</dt><dd>'+won(missed)+'</dd></div>'+
          '<div><dt>주고받은 제안</dt><dd>'+st.rounds+'번</dd></div>'+
          '<div><dt>나눈 이야기</dt><dd>상태 질문 '+st.qCount+'개 · 거래 방식 '+Object.keys(st.met).length+'개</dd></div>'+
        '</dl>'+
        '<div class="act"><button class="btn primary" data-act="retry">같은 상품 다시 해보기</button><button class="btn ghost" data-go="feed">다른 상품 고르기</button></div>'+
      '</div>';
    show('report');
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function(e){
    var t = e.target.closest('button'); if(!t) return;
    if(t.dataset.cat){ cat=t.dataset.cat; renderCats(); renderFeed(); return; }
    if(t.classList.contains('item')){ openDetail(Number(t.dataset.id)); return; }
    if(t.id==='startChat'){ startChat(); return; }
    if(t.id==='chatBack'){ show('detail'); return; }
    if(t.dataset.go){ show(t.dataset.go); return; }
    var a = t.dataset.act; if(!a) return;
    if(a==='open') chooseOpener(Number(t.dataset.i));
    else if(a==='step'){ var uu=unit(st.p.ask); st.offerVal = clamp((st.offerVal||0)+Number(t.dataset.d)*uu, uu, st.curAsk-uu); renderPanel(); }
    else if(a==='set'){ st.offerVal = Number(t.dataset.v); renderPanel(); }
    else if(a==='sweet'){ st.sel[t.dataset.k] = !st.sel[t.dataset.k]; renderPanel(); }
    else if(a==='theme') toggleTheme();
    else if(a==='send') trySend();
    else if(a==='view'){ st.view = t.dataset.v; renderPanel(); }
    else if(a==='ask') doAsk(t.dataset.k);
    else if(a==='meet') doMeet(t.dataset.k);
    else if(a==='follow') doFollow(t.dataset.k);
    else if(a==='buy') buyNow();
    else if(a==='quit') giveUp();
    else if(a==='report') renderReport();
    else if(a==='retry'){ startChat(); }
  });

  document.addEventListener('input', function(e){
    if(e.target.id!=='offerInput') return;
    var d = e.target.value.replace(/[^0-9]/g,'').slice(0,9);
    st.offerVal = d ? Number(d) : 0;
    $('#offerHint').textContent = hintText(st.offerVal);
    var er=$('#offerErr'); if(er) er.hidden = true;
  });
  document.addEventListener('change', function(e){
    if(e.target.id==='offerInput') e.target.value = st.offerVal ? st.offerVal.toLocaleString('ko-KR') : '';
  });
  document.addEventListener('keydown', function(e){
    if(e.target.id==='offerInput' && e.key==='Enter'){ e.preventDefault(); trySend(); }
  });

  paintThemeBtns(); show('feed');
  function loadJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.json();});}
  Promise.all([loadJSON('data/personas.json'),loadJSON('data/products.json')]).then(function(r){
    PERSONAS=r[0]; PRODUCTS=r[1]; renderCats(); renderFeed();
  }).catch(function(e){
    $('#feed').innerHTML='<li style="padding:24px;line-height:1.6">데이터 파일(data/*.json)을 불러오지 못했어요.<br>파일을 더블클릭해서 연 경우 브라우저가 막아요. 폴더에서 <b>python -m http.server</b> 를 실행하고 localhost 주소로 열거나, GitHub Pages에 올려서 확인하세요.</li>';
  });
})();
</script>
</body>
</html>
